<!--
  VYBZ — branded auth email.

  One template for Magic Link, Confirm signup, and Confirm email change.
  {{ .ConfirmationURL }} is the single one-tap action — no codes to copy.

  Apply via supabase/configure-email.mjs or Authentication → Emails in the dashboard.
-->
<style>
  @keyframes vybzGlow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,122,24,0.35), 0 0 20px 4px rgba(255,122,24,0.30); }
    50%      { box-shadow: 0 0 0 6px rgba(255,122,24,0.00), 0 0 34px 10px rgba(255,122,24,0.55); }
  }
  @keyframes vybzFloat {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-4px); }
  }
  .vybz-badge { animation: vybzGlow 2.4s ease-in-out infinite, vybzFloat 3.6s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) {
    .vybz-badge { animation: none; }
  }
</style>
<div style="background:#0f1115;padding:32px 16px;font-family:Lexend,'Atkinson Hyperlegible',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <div style="max-width:480px;margin:0 auto;background:#1c1f26;border:1px solid #30353f;border-radius:20px;padding:38px 32px;text-align:center;">
    <div class="vybz-badge" style="display:inline-block;width:74px;height:74px;border-radius:20px;background:#14161c;border:1px solid rgba(255,122,24,0.45);box-shadow:0 0 22px rgba(255,122,24,0.35);">
      <img src="https://vybz.cloud/icons/icon-192.png" width="44" height="44" alt="VYBZ" style="margin-top:15px;border:0;display:inline-block;" />
    </div>

    <div style="font-size:28px;font-weight:800;letter-spacing:-0.5px;color:#ff7a18;margin-top:20px;">VYBZ</div>
    <div style="font-size:12px;font-weight:600;letter-spacing:1.5px;color:#ff9d4d;margin-top:3px;text-transform:uppercase;">Find Yours.</div>

    <h1 style="font-size:22px;margin:24px 0 10px;color:#ffffff;">Confirm it&rsquo;s you</h1>
    <p style="font-size:15px;line-height:1.6;color:#c9ccd4;margin:0 0 28px;">
      Tap below to continue to VYBZ. This verifies it&rsquo;s you and keeps your
      profile recoverable on any device.
    </p>

    <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:linear-gradient(135deg,#ff7a18,#b3263f);color:#ffffff;text-decoration:none;font-weight:700;font-size:16px;padding:15px 34px;border-radius:14px;box-shadow:0 6px 18px rgba(255,122,24,0.35);">Confirm &amp; open VYBZ</a>

    <p style="font-size:12px;line-height:1.6;color:#8b8f99;margin:30px 0 0;">
      This link expires shortly and can be used once. If you didn&rsquo;t request
      it, ignore this email &mdash; nothing changes.
    </p>
    <p style="font-size:12px;color:#6b6f78;margin:22px 0 0;">&copy; VYBZ</p>
  </div>
</div>
